data_cfg:
  dataset_name: CCGR-MINI
  dataset_root: R:\Datasets\CCGR-MINI
  dataset_partition: ./datasets/CCGR-MINI/CCGR-MINI.json
  num_workers: 0
  data_in_use:
  - 2
  remove_no_gallery: false
  test_dataset_name: CCGR-MINI
  cache: false
evaluator_cfg:
  enable_float16: true
  restore_ckpt_strict: true
  restore_hint: 60000
  save_name: GaitBase_CCGR_Local
  eval_func: evaluate_CCGR_MINI
  sampler:
    batch_shuffle: false
    batch_size: 1
    sample_type: all_ordered
    frames_all_limit: 720
  metric: euc
  transform:
  - type: BaseSilCuttingTransform
loss_cfg:
- loss_term_weight: 1.0
  margin: 0.2
  type: TripletLoss
  log_prefix: triplet
- loss_term_weight: 1.0
  scale: 16
  type: CrossEntropyLoss
  log_prefix: softmax
  log_accuracy: true
model_cfg:
  model: Baseline
  backbone_cfg:
    type: ResNet9
    block: BasicBlock
    channels:
    - 64
    - 128
    - 256
    - 512
    layers:
    - 1
    - 1
    - 1
    - 1
    strides:
    - 1
    - 2
    - 2
    - 1
    maxpool: false
  SeparateFCs:
    in_channels: 512
    out_channels: 256
    parts_num: 16
  SeparateBNNecks:
    class_num: 571
    in_channels: 256
    parts_num: 16
  bin_num:
  - 16
optimizer_cfg:
  lr: 0.1
  momentum: 0.9
  solver: SGD
  weight_decay: 0.0005
scheduler_cfg:
  gamma: 0.1
  milestones:
  - 30000
  - 55000
  - 65000
  scheduler: MultiStepLR
trainer_cfg:
  enable_float16: true
  fix_BN: false
  with_test: false
  log_iter: 10
  restore_ckpt_strict: true
  restore_hint: 0
  save_iter: 500
  save_name: GaitBase_CCGR_Local
  sync_BN: false
  total_iter: 80000
  sampler:
    batch_shuffle: true
    batch_size:
    - 4
    - 2
    frames_num_fixed: 16
    frames_num_max: 50
    frames_num_min: 10
    sample_type: fixed_unordered
    type: TripletSampler
  transform:
  - type: BaseSilCuttingTransform
  find_unused_parameters: false
